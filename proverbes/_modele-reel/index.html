<!doctype html>
<html lang="fr" data-composition-variables='[
  {"id":"carte","type":"string","label":"Illustration (assets/cartes/…)","default":"assets/cartes/01-peul-patience.jpg"},
  {"id":"accroche","type":"string","label":"Accroche","default":"Les Peuls disent…"},
  {"id":"proverbe","type":"string","label":"Proverbe","default":"« La patience peut cuire une pierre. »"},
  {"id":"original","type":"string","label":"Formule d’origine (vide si aucune)","default":"Munyal deefan hayre"},
  {"id":"explication","type":"string","label":"Explication","default":"Avec du temps et de la constance, même ce qui paraît impossible finit par céder."},
  {"id":"message","type":"string","label":"Message (lignes séparées par |)","default":"Ton projet avance moins vite que tu ne voudrais ?|Garde le feu allumé.|Un peu chaque jour.|Les pierres finissent par cuire."},
  {"id":"signature","type":"string","label":"Signature","default":"Sagesse d’Afrique · AFROBACK"}
]'>
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<title>AFROBACK · Reel proverbe</title>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
@font-face { font-family: "Cinzel"; src: url("assets/fonts/Cinzel_700Bold.ttf") format("truetype"); font-weight: 700; }
@font-face { font-family: "Cinzel"; src: url("assets/fonts/Cinzel_900Black.ttf") format("truetype"); font-weight: 900; }
@font-face { font-family: "Manrope"; src: url("assets/fonts/Manrope_600SemiBold.ttf") format("truetype"); font-weight: 600; }
@font-face { font-family: "Manrope"; src: url("assets/fonts/Manrope_800ExtraBold.ttf") format("truetype"); font-weight: 800; }
:root { --night: #0A0F14; --gold: #F0C36B; --gold-soft: #C99A5B; --ivory: #FFF4E0; --muted: #B9A891; }
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--night); }
#root { position: relative; width: 100%; height: 100%; overflow: hidden; background: var(--night); }

/* Fond : la même illustration, agrandie, floue et assombrie */
#bg { position: absolute; left: -140px; top: -140px; width: 1360px; height: 2200px; object-fit: cover; filter: blur(34px) brightness(.32) saturate(1.1); }
#bg-shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(10,15,20,.35) 0%, rgba(10,15,20,.15) 40%, rgba(10,15,20,.75) 62%, rgba(10,15,20,.92) 100%); }

/* Carte : l'illustration du proverbe, encadrée d'or */
#card { position: absolute; left: 160px; top: 230px; width: 760px; height: 848px; border-radius: 26px; overflow: hidden;
  box-shadow: 0 0 0 3px rgba(240,195,107,.75), 0 30px 90px rgba(0,0,0,.6), 0 0 120px rgba(240,195,107,.18); }
#card img { position: absolute; left: 0; top: 0; width: 760px; height: 848px; object-fit: cover; }

/* Zone de texte, sous la carte (au-dessus de la zone basse réservée aux boutons des réseaux) */
.zone { position: absolute; left: 70px; width: 940px; top: 1130px; height: 410px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; text-wrap: balance; }
#t-accroche { font-family: "Cinzel"; font-weight: 700; font-size: 64px; color: var(--gold); }
#t-proverbe { font-family: "Cinzel"; font-weight: 900; font-size: 58px; line-height: 1.22; color: var(--gold); text-shadow: 0 6px 24px rgba(0,0,0,.7); }
#t-original { margin-top: 26px; font-family: "Manrope"; font-weight: 600; font-style: italic; font-size: 32px; color: var(--muted); letter-spacing: 1px; }
#t-explication { font-family: "Manrope"; font-weight: 600; font-size: 46px; line-height: 1.32; color: var(--ivory); }
#t-message { font-family: "Manrope"; font-weight: 800; font-size: 46px; line-height: 1.3; color: var(--ivory); }
#t-message div { margin: 4px 0; }
#t-message div.or { color: var(--gold); }
.sep { width: 120px; height: 3px; margin: 0 auto 30px; background: linear-gradient(90deg, rgba(240,195,107,0), var(--gold), rgba(240,195,107,0)); }
#z-signature img { width: 150px; height: 150px; margin-bottom: 22px; }
#t-signature { font-family: "Cinzel"; font-weight: 700; font-size: 42px; color: var(--gold); letter-spacing: 1px; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="24" data-width="1080" data-height="1920">
  <div id="bg-wrap" style="position:absolute;inset:0"><img id="bg" data-var-src="carte" src="assets/cartes/01-peul-patience.jpg" alt="" /></div>
  <div id="bg-shade"></div>
  <div id="card"><img id="card-img" data-var-src="carte" src="assets/cartes/01-peul-patience.jpg" alt="" /></div>

  <div id="z-accroche" class="zone"><div id="t-accroche" data-var-text="accroche">Les Peuls disent…</div></div>
  <div id="z-proverbe" class="zone"><div class="sep"></div><div id="t-proverbe" data-var-text="proverbe">« La patience peut cuire une pierre. »</div><div id="t-original" data-var-text="original">Munyal deefan hayre</div></div>
  <div id="z-explication" class="zone"><div id="t-explication" data-var-text="explication">Avec du temps et de la constance, même ce qui paraît impossible finit par céder.</div></div>
  <div id="z-message" class="zone"><div id="t-message"></div></div>
  <div id="z-signature" class="zone"><img src="assets/afroback-logo.png" alt="AFROBACK" /><div id="t-signature" data-var-text="signature">Sagesse d’Afrique · AFROBACK</div></div>

  <audio id="musique" src="assets/audio/musique.mp3" data-start="0" data-duration="24" data-media-start="2" data-track-index="10" data-volume="1"
    data-automation='{"version":1,"lanes":[{"target":"volume","points":[{"t":0,"v":0},{"t":1.2,"v":0.85},{"t":22.4,"v":0.85},{"t":24,"v":0}]}]}'></audio>
</div>

<script>
const tl = gsap.timeline({ paused: true });
const V = (window.__hyperframes && window.__hyperframes.getVariables) ? window.__hyperframes.getVariables() : {};

// Message : une ligne par segment « | », la dernière en or
const lignes = String(V.message || "Ton projet avance moins vite que tu ne voudrais ?|Garde le feu allumé.|Un peu chaque jour.|Les pierres finissent par cuire.").split("|").map(s => s.trim()).filter(Boolean);
const msg = document.getElementById("t-message");
msg.innerHTML = lignes.map((l, i) => `<div class="${i === lignes.length - 1 ? "or" : ""}">${l}</div>`).join("");
if (!String(V.original ?? "Munyal deefan hayre").trim()) document.getElementById("t-original").style.display = "none";

gsap.set(["#z-accroche", "#z-proverbe", "#z-explication", "#z-message", "#z-signature"], { opacity: 0 });

// Ouverture : la carte monte, le fond apparaît
tl.fromTo("#bg", { opacity: 0 }, { opacity: 1, duration: 1.2, ease: "power1.out" }, 0);
tl.fromTo("#card", { opacity: 0, y: 60, scale: 0.96 }, { opacity: 1, y: 0, scale: 1, duration: 1.1, ease: "power3.out" }, 0.1);
tl.fromTo("#card-img", { scale: 1.0 }, { scale: 1.12, duration: 24, ease: "none" }, 0);
tl.fromTo("#bg-wrap", { scale: 1.0 }, { scale: 1.08, duration: 24, ease: "none" }, 0);

// Bloc après bloc (lecture : environ 3 mots par seconde)
function bloc(sel, a, b) {
  tl.fromTo(sel, { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, a);
  tl.to(sel, { opacity: 0, y: -16, duration: 0.45, ease: "power2.in" }, b);
}
bloc("#z-accroche", 0.7, 2.9);
bloc("#z-proverbe", 3.3, 8.0);
tl.fromTo("#t-original", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power1.out" }, 4.3);
bloc("#z-explication", 8.5, 13.1);
// Message : les lignes arrivent une à une
tl.set("#z-message", { opacity: 1 }, 13.5);
[...msg.children].forEach((d, i) => tl.fromTo(d, { opacity: 0, y: 22 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 13.5 + i * 1.1));
tl.to("#z-message", { opacity: 0, y: -16, duration: 0.45, ease: "power2.in" }, 20.6);
// Signature, la carte s'efface doucement
tl.to("#card", { opacity: 0.35, duration: 1.0, ease: "power1.inOut" }, 20.8);
tl.fromTo("#z-signature", { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.7, ease: "power2.out" }, 21.1);

window.__timelines["main"] = tl;
tl.seek(0);
</script>
</body>
</html>
