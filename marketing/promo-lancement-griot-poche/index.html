<style>

@font-face { font-family: "Cinzel"; src: url("assets/fonts/Cinzel_700Bold.ttf") format("truetype"); font-weight: 700; }

:root { --night: #0A0F14; --gold: #F0C36B; --ivory: #FFF4E0; --muted: #8C7B67; --p-from: #3a1d0a; --p-via: #1a1006; --p-to: #0c0805; }
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--night); }
#root { position: relative; width: 100%; height: 100%; overflow: hidden; background: var(--night); font-family: "Manrope", sans-serif; }

/* Plans vidéo : chaque clip (déjà recadré en 1080 × 1920) dans une enveloppe non minutée qui porte le léger mouvement de caméra */
.vw { position: absolute; inset: 0; }
.vw video { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; object-fit: cover; }
#vw-bg video { filter: blur(16px) brightness(.45); }
#vw-end video { filter: brightness(.42); }

.shade { position: absolute; left: 0; top: 1180px; width: 1080px; height: 740px; background: linear-gradient(180deg, rgba(10,15,20,0), rgba(10,15,20,.6) 45%, rgba(10,15,20,.8)); }
.vig { position: absolute; inset: 0; background: radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(0,0,0,.6) 100%); }
#black { position: absolute; inset: 0; background: var(--night); }
.title { position: absolute; left: 0; width: 1080px; text-align: center; font-family: "Cinzel"; font-weight: 900; line-height: 1.05; color: var(--gold); text-shadow: 0 8px 30px rgba(0,0,0,.85); }
.title span { display: inline-block; white-space: pre; }

/* Téléphone : lecteur de narration réel, reconstruit d'après app/(tabs)/accueil/heros/[slug]/audio.tsx */
#phone-layer { position: absolute; inset: 0; }
.phone { position: absolute; left: 140px; top: 100px; width: 800px; height: 1720px; border-radius: 104px; background: #17110c; padding: 16px;
  box-shadow: 0 0 0 4px #2c2118, 0 0 90px rgba(240,195,107,.25), 0 50px 140px rgba(0,0,0,.7); }
.screen { position: relative; width: 768px; height: 1688px; border-radius: 90px; overflow: hidden; }
.island { position: absolute; left: 309px; top: 26px; width: 150px; height: 42px; border-radius: 21px; background: #0a0705; }
.player { position: absolute; inset: 0; background: linear-gradient(180deg, var(--p-from), var(--p-via) 55%, var(--p-to)); }
.p-top { position: absolute; top: 108px; left: 60px; right: 60px; height: 50px; }
.p-top .l { position: absolute; left: 0; top: 0; font-size: 40px; color: var(--gold); }
.p-top .c { position: absolute; left: 0; right: 0; top: 10px; text-align: center; font-size: 24px; letter-spacing: 4px; color: var(--muted); }
.p-top .r { position: absolute; right: 0; top: 0; font-size: 40px; color: var(--gold); }
.p-portrait { position: absolute; left: 154px; top: 230px; width: 460px; height: 460px; border-radius: 32px; background: url("assets/img/reine-nzinga.jpg") center 22% / cover; }
.p-glow { position: absolute; left: 114px; top: 190px; width: 540px; height: 540px; border-radius: 50%; background: radial-gradient(circle, rgba(240,195,107,.35), rgba(240,195,107,0) 66%); }
.p-note { position: absolute; left: 570px; top: 646px; width: 86px; height: 86px; border-radius: 50%; background: var(--gold); color: #1a1006; font-size: 44px; line-height: 86px; text-align: center; }
.p-name { position: absolute; left: 0; width: 768px; top: 760px; text-align: center; font-family: "Cinzel"; font-weight: 700; font-size: 62px; color: #F7E7C8; }
.p-sub { position: absolute; left: 0; width: 768px; top: 850px; text-align: center; font-size: 30px; color: var(--muted); }
.p-wave { position: absolute; left: 60px; width: 648px; top: 930px; height: 170px; }
.p-wave i { position: absolute; bottom: 0; width: 10px; border-radius: 5px; background: #C99A5B; }
.p-play { position: absolute; left: 304px; top: 1150px; width: 160px; height: 160px; border-radius: 50%; background: linear-gradient(135deg, var(--gold), #8B5A2B); }
.p-play b { position: absolute; top: 50px; width: 18px; height: 60px; border-radius: 4px; background: #1a1006; }
.p-chap { position: absolute; left: 60px; right: 60px; font-size: 28px; color: var(--muted); }

/* Fin */

<script>
const tl = gsap.timeline({ paused: true });
const q = (s) => document.querySelector(s);

// ---------- titres en lettres qui tombent (signature de la série) ----------
function letterDrop(sel, text, at, stagger = 0.04) {
  const el = q(sel); el.innerHTML = text.split("").map(c => `<span>${c}</span>`).join("");
  [...el.children].forEach((sp, i) => tl.fromTo(sp, { y: -140, opacity: 0 }, { y: 0, opacity: 1, duration: 0.2, ease: "back.out(1.4)" }, at + i * stagger));
}

// ---------- sous-titres karaoké (segments mesurés dans les voix) ----------
const SEGS = [
  [0.30, 2.01, "Autrefois, au coin du feu,"], [2.26, 3.42, "le griot racontait…"], [3.72, 4.97, "et tout le village écoutait."],
  [5.57, 7.05, "Puis le village s'est dispersé."], [7.44, 8.72, "Et les histoires se sont tues."],
  [12.15, 13.43, "Le griot n'est pas parti."], [13.61, 14.93, "Il est là, dans ta poche."], [15.12, 16.71, "La Reine Nzinga, nos héros,"],
  [16.87, 17.46, "nos mythes…"], [17.74, 19.37, "racontés comme au coin du feu."],
];
const GROUPS = [];
SEGS.forEach(([a, b, txt]) => {
  const ws = txt.split(" "); const tot = ws.reduce((n, w) => n + w.length + 1, 0); let acc = 0;
  const timed = ws.map(w => { const at = a + (b - a) * acc / tot; acc += w.length + 1; return { w, at }; });
  for (let i = 0; i < timed.length; i += 3) { const g = timed.slice(i, i + 3); const nx = timed[i + 3]; GROUPS.push({ words: g, start: g[0].at, end: nx ? nx.at : b + 0.35 }); }
});
const subs = q("#subs");
function renderSubs(t) {
  const g = GROUPS.find(x => t >= x.start && t < x.end);
  if (!g) { subs.innerHTML = ""; return; }
  const cur = [...g.words].reverse().find(x => t >= x.at);
  subs.innerHTML = g.words.map(x => `<span class="${x === cur ? "on" : ""}">${x.w}</span>`).join("");
  subs.style.top = (t >= 13.6 && t < 16.05) ? "200px" : "1440px";
}

// ---------- onde du lecteur ----------
const wave = q("#wave"); const bars = [];
for (let i = 0; i < 40; i++) { const b = document.createElement("i"); b.style.left = (i * 16.4) + "px"; wave.appendChild(b); bars.push(b); }
const voiceOn = (t) => SEGS.slice(5).some(([a, b]) => t >= a && t <= b) ? 1 : 0.15;
function render(t) {
  const lit = Math.max(0, Math.min(40, Math.floor((t - 13.6) * 3) + 8)); const e = voiceOn(t);
  bars.forEach((b, i) => {
    const base = 26 + 110 * Math.abs(Math.sin(i * 0.61) * Math.cos(i * 0.23));
    b.style.height = Math.round(base * (0.55 + 0.45 * e * Math.abs(Math.sin(t * 9 + i * 0.9)))) + "px";
    b.style.background = i < lit ? "#F0C36B" : "#C99A5B"; b.style.opacity = i < lit ? 1 : 0.4;
  });
  renderSubs(t);
}
const proxy = { t: 0 };
tl.to(proxy, { t: 30, duration: 30, ease: "none", onUpdate: () => render(proxy.t) }, 0);

// ---------- mouvement de caméra léger sur chaque plan (poussée lente) ----------
const PLANS = [["#w01",0,2.15],["#w02",2.15,1.55],["#w03",3.7,1.65],["#w04",5.35,1.95],["#w05",7.3,2.0],["#w06",10.2,1.8],["#w07",12.0,1.6],
  ["#w09",16.05,0.8],["#w10",16.85,0.85],["#w11",17.7,2.5],["#w12",20.2,1.05],["#w13",21.25,1.0],["#w14",22.25,0.95],["#w15",23.2,1.6],["#vw-end",24.2,5.8]];
PLANS.forEach(([sel, a, d]) => tl.fromTo(sel, { scale: 1.0 }, { scale: 1.06, duration: d, ease: "none" }, a));

// ---------- noir, « Écoute. », la flamme ----------
gsap.set("#black", { opacity: 0 });
tl.fromTo("#w01", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power1.out" }, 0);
tl.to("#black", { opacity: 1, duration: 0.45, ease: "power2.in" }, 8.85);          // les histoires se taisent
letterDrop("#ecoute", "ÉCOUTE.", 9.85);
tl.to("#black", { opacity: 0, duration: 0.6, ease: "power1.out" }, 10.2);          // la flamme renaît
tl.to("#ecoute", { opacity: 0, duration: 0.4, ease: "power2.in" }, 11.5);

// ---------- le téléphone : le griot dans ta poche ----------
gsap.set("#phone-layer", { opacity: 0 });
gsap.set("#phone", { transformOrigin: "50% 50%", scale: 0.78, y: 160 });
tl.set("#phone-layer", { opacity: 1 }, 13.6);
tl.fromTo("#phone", { y: 1300 }, { y: 160, duration: 0.5, ease: "power3.out" }, 13.6);
tl.fromTo("#p-glow", { opacity: 0.5, scale: 0.9 }, { opacity: 1, scale: 1.08, duration: 0.6, ease: "power2.out" }, 15.12);
tl.set("#phone-layer", { opacity: 0 }, 16.05);

// ---------- fin ----------
gsap.set("#end", { opacity: 0 });
tl.fromTo("#vw-end", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power1.inOut" }, 24.2);
tl.set("#end", { opacity: 1 }, 24.8);
tl.fromTo("#end-logo", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(1.6)" }, 25.15);
letterDrop("#end-word", "AFROBACK", 25.3, 0.035);
tl.fromTo("#tag1", { opacity: 0, scale: 1.3 }, { opacity: 1, scale: 1, duration: 0.2, ease: "power2.out" }, 26.3);
tl.fromTo("#tag2", { opacity: 0, scale: 1.3 }, { opacity: 1, scale: 1, duration: 0.2, ease: "power2.out" }, 26.75);
tl.fromTo("#end-badges", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.6, ease: "expo.out" }, 27.3);

window.__timelines["main"] = tl;
tl.seek(0);
</script>
