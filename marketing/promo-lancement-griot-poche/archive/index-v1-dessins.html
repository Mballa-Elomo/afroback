<style>
@font-face { font-family: "Cinzel"; src: url("assets/fonts/Cinzel_900Black.ttf") format("truetype"); font-weight: 900; }
@font-face { font-family: "Cinzel"; src: url("assets/fonts/Cinzel_700Bold.ttf") format("truetype"); font-weight: 700; }
@font-face { font-family: "Manrope"; src: url("assets/fonts/Manrope_600SemiBold.ttf") format("truetype"); font-weight: 600; }
@font-face { font-family: "Manrope"; src: url("assets/fonts/Manrope_800ExtraBold.ttf") format("truetype"); font-weight: 800; }
/* Palette de la série /afroback_video (recit-kit.tsx, theme.ts) */
:root {
  --night: #0A0F14; --night2: #111A24; --gold: #F0C36B; --gold-pale: #F7D98B; --gold-deep: #C98A3D; --ivory: #FFF4E0;
  --muted: #8C7B67; --sil: #05080B; --p-from: #3a1d0a; --p-via: #1a1006; --p-to: #0c0805;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--night); }
#root { position: relative; width: 100%; height: 100%; overflow: hidden; background: var(--night); font-family: "Manrope", sans-serif; }
.clip { position: absolute; inset: 0; overflow: hidden; }
.layer { position: absolute; inset: 0; }
svg.full { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
.night { position: absolute; inset: 0; background: radial-gradient(circle at 50% 55%, rgba(240,160,70,.10) 0%, var(--night2) 40%, var(--night) 80%); }
.vig { position: absolute; inset: 0; background: radial-gradient(ellipse at center, rgba(0,0,0,0) 50%, rgba(0,0,0,.85) 100%); }
.fog { position: absolute; width: 900px; height: 260px; border-radius: 50%; background: rgba(159,179,192,.12); filter: blur(60px); }
.title { position: absolute; left: 0; width: 1080px; text-align: center; font-family: "Cinzel"; font-weight: 900; line-height: 1.05; color: var(--gold); }
.title span { display: inline-block; white-space: pre; }
.ember { position: absolute; width: 8px; height: 8px; border-radius: 50%; background: #FFC861; box-shadow: 0 0 10px #FF9A3C; }

/* ---------- 1 · le griot (illustration AFROBACK) ---------- */
#s1-cam { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
#s1-img { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; background: url("assets/img/histoires.jpg") center / cover; }
#s1-fire { position: absolute; left: 352px; top: 1170px; width: 420px; height: 420px; border-radius: 50%;
  background: radial-gradient(circle, rgba(255,190,90,.55), rgba(255,140,40,.15) 45%, rgba(255,120,30,0) 70%); mix-blend-mode: screen; }
#s1-black { position: absolute; inset: 0; background: var(--night); }

/* ---------- 2 · la dispersion (silhouettes, nuit) ---------- */
#s2-sky { position: absolute; inset: 0; background: linear-gradient(180deg, #0A0F14 0%, #111A24 45%, #22303f 62%, #2d3a4a 64%, #0b1016 66%, #070a0d 100%); }
#s2-black { position: absolute; inset: 0; background: var(--night); }

/* ---------- 3 · « Écoute. » et la braise ---------- */
#ember-big { position: absolute; left: 0; top: 0; width: 60px; height: 60px; }
#ember-big .core { position: absolute; left: 22px; top: 22px; width: 16px; height: 16px; border-radius: 50%; background: #FFF1C4; box-shadow: 0 0 18px 6px rgba(255,200,97,.9); }
#ember-big .halo { position: absolute; left: -90px; top: -90px; width: 240px; height: 240px; border-radius: 50%;
  background: radial-gradient(circle, rgba(255,190,90,.6), rgba(255,154,60,0) 65%); }

/* téléphone partagé (3, 4, 5) */
.phone { position: absolute; left: 140px; top: 100px; width: 800px; height: 1720px; border-radius: 104px; background: #17110c; padding: 16px;
  box-shadow: 0 0 0 4px #2c2118, 0 0 80px rgba(240,195,107,.18), 0 50px 140px rgba(0,0,0,.7); }
.screen { position: relative; width: 768px; height: 1688px; border-radius: 90px; overflow: hidden; background: var(--p-to); }
.shot { position: absolute; left: 0; top: 0; width: 768px; height: 1662px; background-size: 768px auto; background-repeat: no-repeat; }
.island { position: absolute; left: 309px; top: 26px; width: 150px; height: 42px; border-radius: 21px; background: #0a0705; }

/* ---------- 4 · l'app ---------- */
#s4-mask { position: absolute; left: 0; top: 880px; width: 768px; height: 160px; background: linear-gradient(180deg, #0f0b08, #0e0a07); }
#s4-cap { position: absolute; left: 40px; top: 446px; width: 210px; height: 136px; border-radius: 20px; border: 5px solid var(--gold); box-shadow: 0 0 40px rgba(240,195,107,.45); }
#tap { position: absolute; left: 38px; top: 1195px; width: 120px; height: 120px; border-radius: 50%; border: 6px solid var(--gold); }
#bloom { position: absolute; left: 58px; top: 1215px; width: 80px; height: 80px; border-radius: 50%; background: var(--p-from); }
#finger { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }

/* ---------- 5 · le lecteur (reconstruit d'après audio.tsx) ---------- */
.player { position: absolute; inset: 0; background: linear-gradient(180deg, var(--p-from), var(--p-via) 55%, var(--p-to)); }
.p-top { position: absolute; top: 108px; left: 60px; right: 60px; height: 50px; }
.p-top .l { position: absolute; left: 0; top: 0; font-size: 40px; color: var(--gold); }
.p-top .c { position: absolute; left: 0; right: 0; top: 10px; text-align: center; font-size: 24px; letter-spacing: 4px; color: var(--muted); }
.p-top .r { position: absolute; right: 0; top: 0; font-size: 40px; color: var(--gold); }
.p-portrait { position: absolute; left: 154px; top: 230px; width: 460px; height: 460px; border-radius: 32px; background: url("assets/img/reine-nzinga.jpg") center 22% / cover; }
.p-glow { position: absolute; left: 114px; top: 190px; width: 540px; height: 540px; border-radius: 50%; background: radial-gradient(circle, rgba(240,195,107,.35), rgba(240,195,107,0) 66%); }
.p-note { position: absolute; left: 570px; top: 646px; width: 86px; height: 86px; border-radius: 50%; background: var(--gold); color: #1a1006; font-size: 44px; line-height: 86px; text-align: center; }
.p-name { position: absolute; left: 0; width: 768px; top: 760px; text-align: center; font-family: "Cinzel"; font-weight: 700; font-size: 62px; color: #F7E7C8; }
.p-sub { position: absolute; left: 0; width: 768px; top: 850px; text-align: center; font-size: 30px; color: var(--muted); }
.p-wave { position: absolute; left: 60px; width: 648px; top: 930px; height: 170px; }
.p-wave i { position: absolute; bottom: 0; width: 10px; border-radius: 5px; background: #C99A5B; }
.p-play { position: absolute; left: 304px; top: 1150px; width: 160px; height: 160px; border-radius: 50%; background: linear-gradient(135deg, var(--gold), #8B5A2B); }
.p-play b { position: absolute; top: 50px; width: 18px; height: 60px; border-radius: 4px; background: #1a1006; }
.p-chap { position: absolute; left: 60px; right: 60px; font-size: 28px; color: var(--muted); }
.p-chap span { color: var(--gold); }

/* ---------- 6 · le village revient ---------- */
#s6-back { position: absolute; inset: 0; background: radial-gradient(ellipse 1000px 1100px at 50% 82%, #5a3a1c 0%, #2a2620 30%, var(--night2) 60%, var(--night) 90%); }
#s6-queen { position: absolute; left: 90px; top: 300px; width: 900px; height: 900px;
  background: url("assets/img/reine-nzinga.jpg") center / cover;
  -webkit-mask-image: radial-gradient(circle at 50% 46%, #000 34%, rgba(0,0,0,0) 68%); mask-image: radial-gradient(circle at 50% 46%, #000 34%, rgba(0,0,0,0) 68%); }
#s6-glow { position: absolute; left: 140px; top: 1240px; width: 800px; height: 800px; border-radius: 50%;
  background: radial-gradient(circle, rgba(255,214,140,.7), rgba(255,170,80,.2) 38%, rgba(255,154,60,0) 66%); }
#s6-phone { position: absolute; left: 495px; top: 1455px; width: 90px; height: 193px; border-radius: 14px; background: linear-gradient(180deg, var(--p-from), var(--p-to));
  box-shadow: 0 0 0 3px #2c2118, 0 0 60px 18px rgba(255,200,97,.65); }

/* ---------- 7 · signature ---------- */
#s7-logo { position: absolute; left: 350px; top: 330px; width: 380px; height: 380px; }

#s7-badges { position: absolute; left: 0; top: 1250px; width: 1080px; height: 140px; }

/* ---------- sous-titres karaoké (Manrope 800, ivoire, mot courant en or) ---------- */
#subs { position: absolute; left: 60px; right: 60px; top: 1440px; text-align: center; font-family: "Manrope"; font-weight: 800; font-size: 52px; line-height: 1.25;
  color: var(--ivory); text-shadow: 0 4px 14px rgba(0,0,0,.6), 0 0 4px rgba(0,0,0,.6); }
#subs span { margin: 0 8px; }
#subs span.on { color: var(--gold); }
#grain { position: absolute; inset: 0; width: 1080px; height: 1920px; opacity: .07; mix-blend-mode: overlay; pointer-events: none; }
</style>

<script>
const tl = gsap.timeline({ paused: true });
const q = (s) => document.querySelector(s);

// ---------- pseudo-hasard déterministe ----------
const rnd = (k) => { const x = Math.sin(k * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };

// ---------- titres « LetterDrop » (lettres qui tombent, comme la série) ----------
function letters(sel, text) { const el = q(sel); el.innerHTML = text.split("").map(c => `<span>${c}</span>`).join(""); return [...el.children]; }
function letterDrop(sel, text, at, stagger = 0.035) {
  letters(sel, text).forEach((sp, i) => {
    tl.fromTo(sp, { y: -140, opacity: 0 }, { y: 0, opacity: 1, duration: 0.2, ease: "back.out(1.4)" }, at + i * stagger);
  });
}

// ---------- braises (particules qui montent) ----------
function embers(sel, x, y, n, spread, t0, t1) {
  const host = q(sel);
  for (let i = 0; i < n; i++) {
    const e = document.createElement("div"); e.className = "ember"; host.appendChild(e);
    const s = 0.6 + rnd(i + 3) * 0.9; gsap.set(e, { x: x + (rnd(i) - 0.5) * spread, y: y, scale: s, opacity: 0 });
    const life = 1.3 + rnd(i + 7) * 1.1;
    for (let k = t0 + rnd(i + 11) * life; k < t1; k += life) {
      const dx = (rnd(i * 3 + k) - 0.5) * 120;
      tl.fromTo(e, { x: x + (rnd(i) - 0.5) * spread, y: y, opacity: 0.95 }, { x: `+=${dx}`, y: y - 260 - rnd(i + 5) * 260, opacity: 0, duration: Math.min(life, t1 - k), ease: "power1.out" }, k);
    }
  }
}

// ---------- sous-titres karaoké (3 mots, mot courant en or) ----------
// Segments mesurés dans les fichiers de voix (silences à -40 dB).
const SEGS = [
  [0.30, 2.01, "Autrefois, au coin du feu,"], [2.26, 3.42, "le griot racontait…"], [3.72, 4.97, "et tout le village écoutait."],
  [5.57, 7.05, "Puis le village s'est dispersé."], [7.44, 8.72, "Et les histoires se sont tues."],
  [12.15, 13.43, "Le griot n'est pas parti."], [13.61, 14.93, "Il est là, dans ta poche."], [15.12, 16.71, "La Reine Nzinga, nos héros,"],
  [16.87, 17.46, "nos mythes…"], [17.74, 19.37, "racontés comme au coin du feu."],
];
const GROUPS = [];
SEGS.forEach(([a, b, txt]) => {
  const ws = txt.split(" "); const tot = ws.reduce((n, w) => n + w.length + 1, 0); let acc = 0;
  const timed = ws.map(w => { const at = a + (b - a) * acc / tot; acc += w.length + 1; return { w, at }; });
  for (let i = 0; i < timed.length; i += 3) {
    const g = timed.slice(i, i + 3); const next = timed[i + 3];
    GROUPS.push({ words: g, start: g[0].at, end: next ? next.at : b + 0.35 });
  }
});
const subs = q("#subs");
function renderSubs(t) {
  const g = GROUPS.find(x => t >= x.start && t < x.end);
  if (!g) { subs.innerHTML = ""; return; }
  const cur = [...g.words].reverse().find(x => t >= x.at);
  subs.innerHTML = g.words.map(x => `<span class="${x === cur ? "on" : ""}">${x.w}</span>`).join("");
  subs.style.top = (t >= 12.1 && t < 19.6) ? "270px" : "1440px";
}

// ---------- onde sonore du lecteur ----------
const wave = q("#wave"); const BARS = 40; const bars = [];
for (let i = 0; i < BARS; i++) { const b = document.createElement("i"); b.style.left = (i * 16.4) + "px"; wave.appendChild(b); bars.push(b); }
const voiceOn = (t) => SEGS.slice(5).some(([a, b]) => t >= a && t <= b) ? 1 : 0.15;

// ---------- marcheurs, grain ----------
const grt = q("#grt");
function render(t) {
  const step = Math.floor(t * 4) % 2;
  document.querySelectorAll("#s2-walkers .wa").forEach(g => g.style.opacity = step ? 1 : 0);
  document.querySelectorAll("#s2-walkers .wb").forEach(g => g.style.opacity = step ? 0 : 1);
  grt.setAttribute("seed", String(Math.floor(t * 30) % 6));
  const lit = Math.max(0, Math.min(BARS, Math.floor((t - 14.15) * 2.4) + 8)); const e = voiceOn(t);
  bars.forEach((b, i) => {
    const base = 26 + 110 * Math.abs(Math.sin(i * 0.61) * Math.cos(i * 0.23));
    b.style.height = Math.round(base * (0.55 + 0.45 * e * Math.abs(Math.sin(t * 9 + i * 0.9)))) + "px";
    b.style.background = i < lit ? "#F0C36B" : "#C99A5B"; b.style.opacity = i < lit ? 1 : 0.4;
  });
  renderSubs(t);
}
const proxy = { t: 0 };
tl.to(proxy, { t: 30, duration: 30, ease: "none", onUpdate: () => render(proxy.t) }, 0);

// ================= 4 · l'app =================

// ================= 6 · le village revient =================
gsap.set("#s6-shadows", { transformOrigin: "540px 1560px" });

// ================= 7 · signature =================
