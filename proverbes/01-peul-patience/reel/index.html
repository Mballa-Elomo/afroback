<script>
const tl = gsap.timeline({ paused: true });
const q = (s) => document.querySelector(s);
const rnd = (k) => { const x = Math.sin(k * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

/* ---------- textes en lettres qui tombent ---------- */
function letterDrop(sel, text, at, stagger = 0.04) {
  const el = q(sel); el.innerHTML = text.split("").map(c => `<span>${c}</span>`).join("");
  [...el.children].forEach((sp, i) => tl.fromTo(sp, { y: -120, opacity: 0 }, { y: 0, opacity: 1, duration: 0.22, ease: "back.out(1.5)" }, at + i * stagger));
}

/* ---------- sous-titres karaoké (segments mesurés dans les voix) ---------- */
const SEGS = [
  [2.6, 3.64, "Les Peuls disent…"],
  [9.8, 11.63, "Avec du temps et de la constance,"], [11.86, 14.31, "même ce qui paraît impossible finit par céder."],
];
const GROUPS = [];
SEGS.forEach(([a, b, txt]) => {
  const ws = txt.split(" "); const tot = ws.reduce((n, w) => n + w.length + 1, 0); let acc = 0;
  const timed = ws.map(w => { const at = a + (b - a) * acc / tot; acc += w.length + 1; return { w, at }; });
  for (let i = 0; i < timed.length; i += 3) { const g = timed.slice(i, i + 3); const nx = timed[i + 3]; GROUPS.push({ words: g, start: g[0].at, end: nx ? nx.at : b + 0.4 }); }
});
const subs = q("#subs");

/* ---------- carte : contours qui se dessinent, pays peuls qui s'allument ---------- */
const paths = [...document.querySelectorAll("#map-paths path")];
paths.forEach(p => { const L = p.getTotalLength(); p.style.strokeDasharray = L; p.style.strokeDashoffset = L; });

/* ---------- particules (dessinées image par image, déterministes) ---------- */
const cv = q("#fx"), cx = cv.getContext("2d");
function ember(x, y, r, a) {
  const g = cx.createRadialGradient(x, y, 0, x, y, r * 4);
  g.addColorStop(0, `rgba(255,236,190,${a})`); g.addColorStop(0.25, `rgba(255,170,70,${a * 0.8})`); g.addColorStop(1, "rgba(255,120,30,0)");
  cx.fillStyle = g; cx.beginPath(); cx.arc(x, y, r * 4, 0, Math.PI * 2); cx.fill();
}
function emberField(t, t0, t1, ex, ey, n, spread, rise, seed, alpha = 1) {
  if (t < t0 || t > t1) return;
  const fade = clamp((t - t0) / 0.6, 0, 1) * clamp((t1 - t) / 0.6, 0, 1) * alpha;
  for (let i = 0; i < n; i++) {
    const L = 1.6 + rnd(seed + i) * 1.8, ph = rnd(seed + i * 3.7) * L;
    const age = ((t - t0 + ph) % L), k = age / L;
    const x = ex + (rnd(seed + i * 1.3) - 0.5) * spread + Math.sin((t + i) * 2.1) * 26 * k;
    const y = ey - k * rise * (0.6 + rnd(seed + i * 5.1) * 0.8);
    ember(x, y, 1.6 + rnd(seed + i * 2.9) * 2.4, (1 - k) * (k < 0.1 ? k * 10 : 1) * fade);
  }
}
function steam(t, t0, t1, ex, ey) {
  if (t < t0 || t > t1) return;
  const fade = clamp((t - t0) / 0.8, 0, 1) * clamp((t1 - t) / 0.8, 0, 1);
  for (let i = 0; i < 16; i++) {
    const L = 3.2 + rnd(80 + i) * 1.6, age = ((t - t0 + rnd(90 + i) * L) % L), k = age / L;
    const x = ex + (rnd(70 + i) - 0.5) * 120 + Math.sin(t * 0.9 + i) * 40 * k + k * 60;
    const y = ey - k * 520, r = 50 + k * 170;
    const g = cx.createRadialGradient(x, y, 0, x, y, r);
    const a = 0.16 * Math.sin(Math.PI * k) * fade;
    g.addColorStop(0, `rgba(255,236,210,${a})`); g.addColorStop(1, "rgba(255,236,210,0)");
    cx.fillStyle = g; cx.beginPath(); cx.arc(x, y, r, 0, Math.PI * 2); cx.fill();
  }
}
function dust(t, t0, t1, cxp, cyp, w, h, seed) {
  if (t < t0 || t > t1) return;
  const fade = clamp((t - t0) / 0.8, 0, 1) * clamp((t1 - t) / 0.8, 0, 1);
  for (let i = 0; i < 40; i++) {
    const x = cxp + (rnd(seed + i) - 0.5) * w + Math.sin(t * 0.4 + i) * 30;
    const y = cyp + ((rnd(seed + i * 2) * h + t * (8 + rnd(seed + i * 3) * 14)) % h) - h / 2;
    const a = (0.25 + 0.35 * Math.abs(Math.sin(t * 1.3 + i))) * fade;
    cx.fillStyle = `rgba(255,230,180,${a})`; cx.beginPath(); cx.arc(x, y, 1.2 + rnd(seed + i * 4) * 2.2, 0, Math.PI * 2); cx.fill();
  }
}
function travellingEmber(t) {          // B → C : une braise quitte le feu et devient la lampe
  const t0 = 15.2, t1 = 16.3; if (t < t0 || t > t1) return;
  const k = (t - t0) / (t1 - t0), e = k * k * (3 - 2 * k);
  const x = 540 + (994 - 540) * e + Math.sin(k * Math.PI) * -160, y = 1440 + (806 - 1440) * e - Math.sin(k * Math.PI) * 220;
  for (let j = 0; j < 10; j++) { const kk = Math.max(0, e - j * 0.025); ember(540 + (994 - 540) * kk + Math.sin(kk * Math.PI) * -160, 1440 + (806 - 1440) * kk - Math.sin(kk * Math.PI) * 220, 3 - j * 0.25, (1 - j / 10) * 0.8); }
  ember(x, y, 6 + 4 * Math.sin(k * Math.PI), 1);
}
function converge(t) {                 // D : les braises se rassemblent en logo
  const t0 = 23.9, t1 = 24.9; if (t < t0 || t > 26.5) return;
  for (let i = 0; i < 46; i++) {
    const sx = rnd(300 + i) * 1080, sy = 1100 + rnd(400 + i) * 820, k = clamp((t - t0 - rnd(500 + i) * 0.25) / (t1 - t0), 0, 1), e = 1 - Math.pow(1 - k, 3);
    const ang = i / 46 * Math.PI * 2, tx = 540 + Math.cos(ang) * 190, ty = 650 + Math.sin(ang) * 190;
    const a = t > t1 ? clamp((26.5 - t) / 1.6, 0, 1) : 1;
    ember(sx + (tx - sx) * e, sy + (ty - sy) * e, 2.2, a * (0.4 + 0.6 * e));
  }
}
function burst(t, t0, x, y) {          // gerbe d'étincelles sur la dernière phrase
  if (t < t0 || t > t0 + 1.4) return;
  const k = (t - t0) / 1.4;
  for (let i = 0; i < 30; i++) { const ang = rnd(600 + i) * Math.PI * 2, sp = 180 + rnd(700 + i) * 260; ember(x + Math.cos(ang) * sp * k, y + Math.sin(ang) * sp * k + 120 * k * k, 2, 1 - k); }
}

/* ---------- rendu image par image ---------- */
function render(t) {
  cx.clearRect(0, 0, 1080, 1920);
  cx.globalCompositeOperation = "lighter";
  emberField(t, 0, 5.4, 540, 1330, 34, 150, 900, 10);
  steam(t, 5.4, 15.6, 520, 960);
  emberField(t, 5.4, 15.6, 540, 1420, 22, 120, 700, 40, 0.85);
  dust(t, 5.6, 15.6, 540, 900, 1000, 1400, 150);
  travellingEmber(t);
  dust(t, 16.0, 24.2, 900, 860, 420, 700, 200);
  burst(t, 21.5, 540, 1360);
  converge(t);
  cx.globalCompositeOperation = "source-over";
  // lumières vivantes
  const fl = (a) => 0.78 + 0.14 * Math.sin(t * 13.1 + a) + 0.08 * Math.sin(t * 7.3 + a * 2);
  q("#a-fire").style.opacity = fl(0); q("#b-fire").style.opacity = fl(1.7); q("#c-lamp").style.opacity = 0.85 + 0.15 * Math.sin(t * 5.1);
  q("#b-rays").style.transform = `rotate(${t * 2.2}deg)`;
  // karaoké
  const g = GROUPS.find(x => t >= x.start && t < x.end);
  if (!g) subs.innerHTML = ""; else { const cur = [...g.words].reverse().find(x => t >= x.at); subs.innerHTML = g.words.map(x => `<span class="${x === cur ? "on" : ""}">${x.w}</span>`).join(""); }
}
const proxy = { t: 0 };
tl.to(proxy, { t: 30, duration: 30, ease: "none", onUpdate: () => render(proxy.t) }, 0);

tl.fromTo("#carte", { scale: 0.92 }, { scale: 1.0, duration: 2.6, ease: "power2.out" }, 2.3);
tl.fromTo("#carte-label", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 3.4);
tl.to(["#carte", "#carte-label"], { opacity: 0, duration: 0.35, ease: "power2.in" }, 4.75);
// A → B : plongée dans le feu
tl.to("#aCam", { scale: 2.8, duration: 0.85, ease: "power3.in" }, 4.95);
tl.to("#aCam", { filter: "blur(14px)", duration: 0.85, ease: "power2.in" }, 4.95);
