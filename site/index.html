<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AFROBACK — Retour aux origines</title>
<meta name="description" content="AFROBACK raconte, célèbre et transmet les héros, les cultures et les richesses du continent africain. Retour aux origines.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{background:#0F0B08;color:#E8DCC6;font-family:'Barlow',system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
  a{color:#F0C36B;text-decoration:none}
  a:hover{color:#F7D98C}
  ::selection{background:rgba(240,195,107,.3);color:#fff}
  button{font-family:inherit}

  @keyframes ab-spin{to{transform:rotate(360deg)}}
  @keyframes ab-shimmer{0%{background-position:0% 50%}100%{background-position:200% 50%}}
  @keyframes ab-pulse{0%,100%{opacity:.45}50%{opacity:.85}}
  @keyframes ab-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(9px)}}
  @keyframes ab-word-in{from{opacity:0;transform:translateY(0.7em) scale(.92)}to{opacity:1;transform:none}}

  [data-reveal]{transition:opacity .9s cubic-bezier(.2,.7,.2,1), transform .9s cubic-bezier(.2,.7,.2,1)}
  [data-reveal].is-visible{opacity:1 !important}
  [data-reveal]:not([data-parallax]).is-visible{transform:none !important}

  .nav-link{color:#D8C6A6;font-size:14px;letter-spacing:.04em;transition:color .25s}
  .nav-link:hover{color:#F0C36B}

  .lang-btn{transition:background .25s}
  .lang-btn:hover{background:rgba(240,195,107,.16)}
  .lang-option:hover{background:rgba(240,195,107,.12) !important}

  .btn-gold{transition:transform .25s,box-shadow .25s}
  .btn-gold-header:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgba(224,169,78,.45)}
  .btn-gold-hero:hover{transform:translateY(-3px);box-shadow:0 16px 44px rgba(224,169,78,.55)}
  .btn-outline-gold{transition:background .25s,border-color .25s}
  .btn-outline-gold:hover{background:rgba(240,195,107,.1);border-color:rgba(240,195,107,.7)}

  .pillar-card{transition:transform .4s ease,border-color .4s ease,box-shadow .4s ease}
  .pillar-card:hover{transform:translateY(-8px);border-color:rgba(240,195,107,.45);box-shadow:0 26px 60px rgba(0,0,0,.5)}

  .social-icon{transition:background .25s,color .25s}
  .social-icon:hover{background:rgba(240,195,107,.1);color:#F0C36B}
  .footer-lang-btn{transition:all .25s}
  .footer-lang-btn:hover{color:#F0C36B;border-color:rgba(240,195,107,.5)}

  .field-input{transition:border-color .25s}
  .field-input:focus{border-color:rgba(240,195,107,.7)}

  .gallery-item{transition:box-shadow .6s cubic-bezier(.2,.7,.2,1),border-color .6s ease,filter .6s ease;filter:brightness(1) saturate(1);cursor:pointer}
  .gallery-item:hover{box-shadow:0 30px 72px rgba(0,0,0,.6),0 0 40px rgba(240,195,107,.26);border-color:rgba(240,195,107,.6) !important;filter:brightness(1.2) saturate(1.14)}

  .mobile-link{display:block}

  @media (prefers-reduced-motion: reduce){
    *{animation:none!important}
    html{scroll-behavior:auto}
  }
</style>
</head>
<body>
<div id="root" style="position:relative;background:#0F0B08;background-image:radial-gradient(120% 80% at 50% -10%, rgba(139,90,43,.22), transparent 60%);">

  <!-- REVIEW BANNER -->
  <div id="review-banner" style="display:none;position:fixed;top:0;left:0;right:0;z-index:120;background:linear-gradient(90deg,#8B3A2F,#A0522D);color:#FCEBCB;font-size:12.5px;letter-spacing:.02em;text-align:center;padding:8px 46px;line-height:1.35;box-shadow:0 2px 18px rgba(0,0,0,.45)">
    <strong id="review-lang-name" style="font-weight:600;"></strong> — <span id="review-note"></span>
  </div>

  <!-- HEADER -->
  <header id="header" style="position:fixed;left:0;right:0;z-index:110;transition:background .4s ease,backdrop-filter .4s ease,border-color .4s ease;top:0;border-bottom:1px solid transparent;">
    <div style="max-width:1280px;margin:0 auto;padding:20px 28px;display:flex;align-items:center;gap:24px;">
      <a href="#top" style="display:flex;align-items:center;gap:13px;flex-shrink:0">
        <span style="display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:radial-gradient(circle at 50% 40%,#F0C36B,#8B5A2B 70%,#3a2410);box-shadow:0 0 0 1px rgba(240,195,107,.35),0 0 26px rgba(240,195,107,.35);color:#160f08;font-family:'Cinzel',serif;font-weight:800;font-size:19px;">A</span>
        <span style="font-family:'Cinzel',serif;font-weight:700;font-size:19px;letter-spacing:.28em;color:#F3E4C4">AFROBACK</span>
      </a>
      <nav id="desktop-nav" style="display:flex;gap:26px;margin-left:14px;flex:1">
        <a href="#mission" class="nav-link" data-i18n="navMission"></a>
        <a href="#piliers" class="nav-link" data-i18n="navPiliers"></a>
        <a href="#decouvrir" class="nav-link" data-i18n="navDecouvrir"></a>
        <a href="#rejoindre" class="nav-link" data-i18n="navRejoindre"></a>
      </nav>

      <div style="position:relative;flex-shrink:0">
        <button id="lang-toggle" class="lang-btn" aria-haspopup="listbox" style="display:flex;align-items:center;gap:8px;background:rgba(240,195,107,.07);border:1px solid rgba(240,195,107,.28);color:#F0C36B;font-family:'Barlow',sans-serif;font-size:13px;font-weight:600;letter-spacing:.08em;padding:9px 13px;border-radius:8px;cursor:pointer;">
          <span style="display:inline-block;width:7px;height:7px;border-radius:50%;background:#F0C36B;box-shadow:0 0 8px #F0C36B"></span>
          <span id="current-lang-code"></span>
          <span id="lang-caret" style="font-size:9px;opacity:.7;transition:transform .25s">▾</span>
        </button>
        <ul id="lang-list" role="listbox" style="display:none;position:absolute;top:calc(100% + 10px);right:0;min-width:210px;list-style:none;background:#14100b;border:1px solid rgba(240,195,107,.22);border-radius:12px;padding:7px;box-shadow:0 24px 60px rgba(0,0,0,.6);z-index:130;"></ul>
      </div>

      <a href="#rejoindre" id="header-cta" class="btn-gold btn-gold-header" style="display:inline-flex;flex-shrink:0;white-space:nowrap;font-family:'Barlow',sans-serif;font-weight:600;font-size:13.5px;letter-spacing:.04em;color:#160f08;background:linear-gradient(100deg,#F7D98C,#E0A94E 55%,#C07C34);padding:11px 20px;border-radius:9px;box-shadow:0 6px 22px rgba(224,169,78,.28);"></a>

      <button id="burger" aria-label="Menu" style="display:none;flex-direction:column;justify-content:center;gap:5px;flex-shrink:0;width:44px;height:44px;align-items:center;background:rgba(240,195,107,.07);border:1px solid rgba(240,195,107,.28);border-radius:10px;cursor:pointer;">
        <span style="display:block;width:22px;height:2px;background:#F0C36B;border-radius:2px;"></span>
        <span style="display:block;width:22px;height:2px;background:#F0C36B;border-radius:2px;"></span>
        <span style="display:block;width:22px;height:2px;background:#F0C36B;border-radius:2px;"></span>
      </button>
    </div>
  </header>

  <!-- MOBILE MENU PANEL -->
  <div id="mobile-menu-panel" style="display:none;position:fixed;inset:0;z-index:200;background:rgba(9,6,4,.97);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);flex-direction:column;padding:26px 26px 40px;overflow-y:auto;">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:34px;">
      <span style="font-family:'Cinzel',serif;font-weight:700;font-size:18px;letter-spacing:.26em;color:#F3E4C4;">AFROBACK</span>
      <button id="mobile-menu-close" aria-label="Fermer" style="width:44px;height:44px;border-radius:11px;background:none;border:1px solid rgba(240,195,107,.3);color:#F0C36B;font-size:20px;cursor:pointer;line-height:1;">✕</button>
    </div>
    <nav style="display:flex;flex-direction:column;">
      <a href="#mission" class="mobile-link" style="font-family:'Cinzel',serif;font-size:26px;color:#F3E4C4;padding:16px 0;border-bottom:1px solid rgba(240,195,107,.12);" data-i18n="navMission"></a>
      <a href="#piliers" class="mobile-link" style="font-family:'Cinzel',serif;font-size:26px;color:#F3E4C4;padding:16px 0;border-bottom:1px solid rgba(240,195,107,.12);" data-i18n="navPiliers"></a>
      <a href="#decouvrir" class="mobile-link" style="font-family:'Cinzel',serif;font-size:26px;color:#F3E4C4;padding:16px 0;border-bottom:1px solid rgba(240,195,107,.12);" data-i18n="navDecouvrir"></a>
      <a href="#rejoindre" class="mobile-link" style="font-family:'Cinzel',serif;font-size:26px;color:#F3E4C4;padding:16px 0;border-bottom:1px solid rgba(240,195,107,.12);" data-i18n="navRejoindre"></a>
    </nav>
    <a href="#rejoindre" class="mobile-link" id="mobile-cta" style="margin-top:30px;text-align:center;font-family:'Barlow',sans-serif;font-weight:600;font-size:16px;color:#160f08;background:linear-gradient(100deg,#F7D98C,#E0A94E 55%,#C07C34);padding:16px 24px;border-radius:12px;box-shadow:0 10px 30px rgba(224,169,78,.35);"></a>
    <div style="margin-top:34px;">
      <div data-i18n="footerLangs" style="font-family:'Cinzel',serif;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#C98A5E;margin-bottom:14px;"></div>
      <div id="mobile-langs" style="display:flex;flex-wrap:wrap;gap:9px;"></div>
    </div>
  </div>

  <!-- HERO -->
  <section id="top" style="position:relative;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;padding:118px 24px 88px;">
    <div data-parallax="0.15" style="position:absolute;inset:-8% -4% 0;z-index:0;background:radial-gradient(70% 55% at 50% 42%, rgba(160,82,45,.30), transparent 70%);"></div>
    <div data-parallax="0.4" style="position:absolute;left:50%;top:44%;width:820px;height:820px;max-width:130vw;transform:translate(-50%,-50%);z-index:1;opacity:.9;pointer-events:none;background:radial-gradient(circle, rgba(240,195,107,.16), rgba(240,195,107,.04) 45%, transparent 62%);"></div>
    <canvas id="hero-canvas" style="position:absolute;inset:0;z-index:2;width:100%;height:100%;pointer-events:none;"></canvas>

    <div data-parallax="0.2" style="position:absolute;left:50%;top:54%;transform:translate(-50%,-50%);z-index:1;width:min(74vw,680px);aspect-ratio:1/1;pointer-events:none;">
      <div style="position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle,rgba(247,217,140,.20),transparent 60%);animation:ab-pulse 7s ease-in-out infinite;"></div>
      <svg viewBox="0 0 410 410" style="position:absolute;inset:0;width:100%;height:100%;opacity:.4;animation:ab-spin 90s linear infinite;">
        <circle cx="205" cy="205" r="196" fill="none" stroke="#F0C36B" stroke-opacity=".3" stroke-width="1" stroke-dasharray="2 16"/>
        <circle cx="205" cy="205" r="176" fill="none" stroke="#A0522D" stroke-opacity=".35" stroke-width="1" stroke-dasharray="1 22"/>
      </svg>
    </div>

    <div data-parallax="-0.12" style="position:relative;z-index:5;text-align:center;max-width:980px;width:100%;">
      <div style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:135%;height:150%;z-index:-1;background:radial-gradient(closest-side, rgba(11,8,5,.66), rgba(11,8,5,.32) 55%, transparent 78%);pointer-events:none;"></div>
      <p data-reveal data-i18n="heroKicker" style="font-family:'Barlow',sans-serif;letter-spacing:.42em;font-size:12.5px;text-transform:uppercase;color:#F0C980;margin-bottom:26px;text-shadow:0 2px 12px rgba(11,8,5,.9);"></p>
      <h1 id="slogan" style="font-family:'Cinzel',serif;font-weight:800;line-height:.98;font-size:clamp(38px,6.8vw,88px);"></h1>
      <p data-reveal id="hero-lead" style="margin:26px auto 0;max-width:560px;font-size:clamp(15px,2vw,19px);line-height:1.6;color:#EBDDC2;text-shadow:0 2px 14px rgba(11,8,5,.85);"></p>

      <div data-reveal id="carousel-wrap" style="margin:36px auto 0;width:100%;max-width:900px;height:clamp(300px,40vh,400px);perspective:1500px;perspective-origin:50% 44%;touch-action:pan-y;cursor:grab;">
        <div id="carousel-stage" style="position:relative;width:100%;height:100%;transform-style:preserve-3d;"></div>
      </div>
      <p data-reveal style="margin:12px auto 0;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#9a835f;display:flex;align-items:center;gap:9px;justify-content:center;">
        <span style="font-size:15px;color:#C98A5E;">⇆</span> <span id="drag-hint"></span>
      </p>

      <div data-reveal style="margin-top:30px;display:flex;gap:16px;justify-content:center;flex-wrap:wrap;">
        <a href="#rejoindre" id="hero-cta" class="btn-gold btn-gold-hero" style="font-family:'Barlow',sans-serif;font-weight:600;font-size:15px;letter-spacing:.03em;color:#160f08;background:linear-gradient(100deg,#F7D98C,#E0A94E 55%,#C07C34);padding:16px 34px;border-radius:11px;box-shadow:0 10px 34px rgba(224,169,78,.4);"></a>
        <a href="#mission" id="hero-secondary" class="btn-outline-gold" style="font-family:'Barlow',sans-serif;font-weight:500;font-size:15px;letter-spacing:.03em;color:#F0C36B;border:1px solid rgba(240,195,107,.4);padding:16px 30px;border-radius:11px;"></a>
      </div>
    </div>

    <div style="position:absolute;bottom:26px;left:50%;transform:translateX(-50%);z-index:5;display:flex;flex-direction:column;align-items:center;gap:9px;animation:ab-bob 2.6s ease-in-out infinite;">
      <span id="scroll-hint" style="font-size:10.5px;letter-spacing:.3em;text-transform:uppercase;color:#8f7a5c"></span>
      <span style="width:1px;height:34px;background:linear-gradient(#F0C36B,transparent)"></span>
    </div>
  </section>

  <!-- MISSION -->
  <section id="mission" style="position:relative;padding:clamp(90px,13vw,170px) 24px;overflow:hidden;">
    <div data-parallax="0.08" style="position:absolute;right:-10%;top:0;width:60%;height:100%;z-index:0;opacity:.5;background:radial-gradient(60% 60% at 80% 30%,rgba(160,82,45,.28),transparent 65%)"></div>
    <div style="position:relative;z-index:2;max-width:1080px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:clamp(40px,6vw,90px);align-items:center" id="mission-grid">
      <div>
        <p data-reveal data-i18n="missionKicker" style="font-family:'Barlow',sans-serif;letter-spacing:.34em;font-size:12px;text-transform:uppercase;color:#C98A5E;margin-bottom:22px;"></p>
        <h2 data-reveal data-i18n="missionTitle" style="font-family:'Cinzel',serif;font-weight:700;font-size:clamp(30px,4.4vw,52px);line-height:1.08;color:#F3E4C4;margin-bottom:26px;"></h2>
        <p data-reveal data-i18n="missionBody1" style="font-size:clamp(15px,1.7vw,18px);line-height:1.75;color:#CDBB9C;margin-bottom:18px;"></p>
        <p data-reveal data-i18n="missionBody2" style="font-size:clamp(15px,1.7vw,18px);line-height:1.75;color:#CDBB9C;"></p>
      </div>
      <div data-reveal data-parallax="0.06" style="position:relative;aspect-ratio:4/5;border-radius:18px;overflow:hidden;border:1px solid rgba(240,195,107,.22);background:repeating-linear-gradient(135deg, rgba(240,195,107,.05) 0 14px, transparent 14px 28px), linear-gradient(160deg,#1c140c,#2a1a0e);box-shadow:0 30px 70px rgba(0,0,0,.5)">
        <div style="position:absolute;inset:0;background:radial-gradient(circle at 50% 30%,rgba(240,195,107,.14),transparent 60%)"></div>
        <div style="position:absolute;inset:0;display:flex;align-items:flex-end;padding:26px">
          <span data-i18n="phMissionImg" style="font-family:'Barlow',monospace;font-size:11.5px;letter-spacing:.06em;color:#B08A5E;border:1px dashed rgba(176,138,94,.5);border-radius:8px;padding:8px 12px;background:rgba(15,11,8,.5)"></span>
        </div>
      </div>
    </div>
  </section>

  <!-- PILIERS -->
  <section id="piliers" style="position:relative;padding:clamp(80px,11vw,150px) 24px;background:linear-gradient(180deg,transparent,rgba(139,90,43,.10),transparent)">
    <div style="max-width:1180px;margin:0 auto;">
      <div style="text-align:center;max-width:680px;margin:0 auto clamp(48px,6vw,80px)">
        <p data-reveal data-i18n="pillarsKicker" style="font-family:'Barlow',sans-serif;letter-spacing:.34em;font-size:12px;text-transform:uppercase;color:#C98A5E;margin-bottom:20px;"></p>
        <h2 data-reveal data-i18n="pillarsTitle" style="font-family:'Cinzel',serif;font-weight:700;font-size:clamp(30px,4.4vw,52px);line-height:1.08;color:#F3E4C4;margin-bottom:22px;"></h2>
        <p data-reveal data-i18n="pillarsIntro" style="font-size:clamp(15px,1.7vw,18px);line-height:1.7;color:#CDBB9C;"></p>
      </div>
      <div id="pillars-grid" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(258px,1fr));gap:22px"></div>
    </div>
  </section>

  <!-- DÉCOUVRIR -->
  <section id="decouvrir" style="position:relative;padding:clamp(80px,11vw,150px) 0 clamp(90px,12vw,160px);overflow:hidden">
    <div style="max-width:1180px;margin:0 auto;padding:0 24px">
      <div style="max-width:640px;margin-bottom:clamp(40px,5vw,64px)">
        <p data-reveal data-i18n="galleryKicker" style="font-family:'Barlow',sans-serif;letter-spacing:.34em;font-size:12px;text-transform:uppercase;color:#C98A5E;margin-bottom:20px;"></p>
        <h2 data-reveal data-i18n="galleryTitle" style="font-family:'Cinzel',serif;font-weight:700;font-size:clamp(30px,4.4vw,52px);line-height:1.08;color:#F3E4C4;margin-bottom:20px;"></h2>
        <p data-reveal data-i18n="galleryIntro" style="font-size:clamp(15px,1.7vw,18px);line-height:1.7;color:#CDBB9C;"></p>
      </div>
      <div id="gallery-grid" style="display:grid;grid-template-columns:repeat(12,1fr);grid-auto-rows:120px;gap:16px"></div>
      <div data-reveal style="margin-top:26px;display:flex;align-items:center;gap:18px;flex-wrap:wrap;border:1px solid rgba(240,195,107,.18);border-radius:16px;padding:22px 26px;background:linear-gradient(120deg,rgba(30,22,13,.7),rgba(20,15,9,.55))">
        <span id="soon-label-museum" style="font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:#C98A5E;border:1px solid rgba(201,138,94,.5);border-radius:20px;padding:5px 12px;flex-shrink:0"></span>
        <div style="flex:1;min-width:220px">
          <h3 data-i18n="museumTeaser" style="font-family:'Cinzel',serif;font-weight:600;font-size:19px;color:#F3E4C4;margin-bottom:5px"></h3>
          <p data-i18n="museumTeaserSub" style="font-size:14px;line-height:1.55;color:#B7A585"></p>
        </div>
        <span style="font-size:22px;color:#8B5A2B;flex-shrink:0">◍</span>
      </div>
    </div>
  </section>

  <!-- REJOINDRE -->
  <section id="rejoindre" style="position:relative;padding:clamp(90px,13vw,180px) 24px;overflow:hidden;background:radial-gradient(90% 120% at 50% 0%,rgba(160,82,45,.30),transparent 60%)">
    <div data-parallax="0.1" style="position:absolute;inset:0;z-index:0;opacity:.5;background:radial-gradient(50% 60% at 50% 45%,rgba(240,195,107,.14),transparent 60%)"></div>
    <div style="position:relative;z-index:2;max-width:620px;margin:0 auto;text-align:center">
      <p data-reveal data-i18n="joinKicker" style="font-family:'Barlow',sans-serif;letter-spacing:.34em;font-size:12px;text-transform:uppercase;color:#C98A5E;margin-bottom:22px;"></p>
      <h2 data-reveal data-i18n="joinTitle" style="font-family:'Cinzel',serif;font-weight:700;font-size:clamp(32px,5vw,58px);line-height:1.05;color:#F3E4C4;margin-bottom:22px;"></h2>
      <p data-reveal data-i18n="joinBody" style="font-size:clamp(15px,1.8vw,19px);line-height:1.7;color:#CDBB9C;margin-bottom:40px;"></p>

      <div id="thanks-box" data-reveal style="display:none;border:1px solid rgba(240,195,107,.35);background:linear-gradient(160deg,rgba(30,22,13,.9),rgba(20,15,9,.95));border-radius:18px;padding:44px 32px;box-shadow:0 24px 60px rgba(0,0,0,.5)">
        <div style="width:56px;height:56px;margin:0 auto 20px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,#F0C36B,#8B5A2B);color:#160f08;font-size:26px;font-family:'Cinzel',serif">✓</div>
        <h3 data-i18n="thanksTitle" style="font-family:'Cinzel',serif;font-weight:600;font-size:24px;color:#F3E4C4;margin-bottom:12px"></h3>
        <p data-i18n="thanksBody" style="font-size:15px;line-height:1.65;color:#B7A585"></p>
      </div>
      <form id="join-form" data-reveal style="display:flex;flex-direction:column;gap:14px;text-align:left">
        <div style="display:flex;gap:14px;flex-wrap:wrap">

  { par:'0.09', bg:stripe('#2a1a0e','#43281a'), cap:'OBJET SACRÉ — masque rituel' },
  { par:'0.13', bg:stripe('#1e140b','#2f1d10'), cap:'SYMBOLE — adinkra' },
  { par:'0.11', bg:stripe('#301d0f','#4a2c1a'), cap:'OUTILS — savoir-faire ancestral' },
  { par:'0.06', bg:stripe('#241608','#3d2413'), cap:'RITE — tradition / cérémonie' },
  { par:'0.1',  bg:stripe('#2a1a0e','#41271a'), cap:'MATIÈRE — bogolan / mudcloth' },
];
/* Desktop: rich 12-col editorial mosaic. Mobile: clean 2-col grid so tiles
   stay readable and never squish/overflow. */
const GAL_SPANS_DESKTOP = [['span 5','span 2'],['span 4','span 1'],['span 3','span 1'],['span 4','span 1'],['span 3','span 2'],['span 5','span 1']];
const GAL_SPANS_MOBILE  = [['span 2','span 1'],['span 1','span 1'],['span 1','span 1'],['span 1','span 1'],['span 1','span 1'],['span 2','span 1']];
function buildGallery(){
  const galMobile = window.innerWidth < 760;
  const spans = galMobile ? GAL_SPANS_MOBILE : GAL_SPANS_DESKTOP;
  return {
    items: GALLERY_DATA.map((g, i) => ({ ...g, col: spans[i][0], row: spans[i][1] })),
    template: galMobile ? 'repeat(2,1fr)' : 'repeat(12,1fr)',
    rowH: galMobile ? '158px' : '120px'
  };
}

const SOCIALS = [
  { name:'Instagram', abbr:'IG' }, { name:'TikTok', abbr:'TK' },
  { name:'YouTube', abbr:'YT' }, { name:'LinkedIn', abbr:'IN' },
];

const OBJECTS = [
  { name:'Masque rituel',         cat:'Rite & cérémonie', ph:'PHOTO — masque rituel' },
  { name:'Statuette Nkisi',       cat:'Protection',       ph:'PHOTO — statuette Nkisi' },
  { name:'Tambour sacré',         cat:'Musique & transe', ph:'PHOTO — tambour sacré' },
  { name:'Calebasse cérémonielle',cat:'Offrandes',        ph:'PHOTO — calebasse' },
  { name:'Tabouret royal',        cat:'Pouvoir',          ph:'PHOTO — tabouret royal' },
  { name:'Reliquaire Byeri',      cat:'Ancêtres',         ph:'PHOTO — reliquaire Byeri' },
  { name:'Bâton de commandement', cat:'Autorité',         ph:'PHOTO — bâton' },
];

let lang = 'fr';
let langOpen = false;
let menuOpen = false;

function render(){
  const meta = LANG_META.find(m => m.key === lang) || LANG_META[0];
  const needsReview = meta.draft;
  const t = { ...DICT.fr, ...(DICT[lang] || {}) };

  document.documentElement.lang = lang === 'en' ? 'en' : 'fr';
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    if (t[key] !== undefined) el.textContent = t[key];
  });

  // Header CTA (short label on narrow screens) + responsive nav/burger switch
  const w = window.innerWidth;
  document.getElementById('header-cta').textContent = w < 560 ? (t.ctaJoinShort || t.ctaJoin) : t.ctaJoin;
  document.getElementById('desktop-nav').style.display = w < 900 ? 'none' : 'flex';
  document.getElementById('header-cta').style.display = w < 900 ? 'none' : 'inline-flex';
  document.getElementById('burger').style.display = w < 900 ? 'flex' : 'none';
  document.getElementById('mobile-cta').textContent = t.ctaJoin;

  document.getElementById('slogan').innerHTML = String(t.heroSlogan).split(' ').map((word, i) => `
    <span style="display:inline-block;margin-right:.22em;background:linear-gradient(100deg,#FCEBCB,#F0C36B 40%,#C07C34 75%,#F0C36B);background-size:220% auto;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;animation:${REDUCED ? 'none' : 'ab-word-in .8s cubic-bezier(.2,.7,.2,1) both, ab-shimmer 9s linear infinite'};animation-delay:${(0.15 + i * 0.16).toFixed(2)}s;">${word}</span>`).join('');
  document.getElementById('hero-lead').textContent = t.heroLead;
  document.getElementById('drag-hint').textContent = t.dragHint;
  document.getElementById('scroll-hint').textContent = t.scrollHint;
  document.getElementById('hero-cta').textContent = t.heroCta;
  document.getElementById('hero-secondary').textContent = t.heroSecondary;
  document.getElementById('form-submit').textContent = t.formButton;
  document.getElementById('form-privacy').textContent = t.formPrivacy;
  document.getElementById('footer-slogan-quote').textContent = '« ' + t.heroSlogan + ' »';
  document.getElementById('field-name').placeholder = t.phName;
  document.getElementById('field-email').placeholder = t.phEmail;
  document.getElementById('soon-label-museum').textContent = t.soonLabel;

  // Review banner
  const banner = document.getElementById('review-banner');
  const header = document.getElementById('header');
  if (needsReview) {
    banner.style.display = 'block';
    header.style.top = '34px';
    document.getElementById('review-lang-name').textContent = meta.name;
    document.getElementById('review-note').textContent =
      "traduction en cours de relecture par un locuteur natif — contenu affiché en français en attendant.";
  } else {
    banner.style.display = 'none';
    header.style.top = '0px';
  }

  // Language dropdown
  const list = document.getElementById('lang-list');
  list.innerHTML = LANG_META.map(m => `
    <li data-lang="${m.key}" class="lang-option" role="option" style="display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:8px;cursor:pointer;background:${m.key === lang ? 'rgba(240,195,107,.12)' : 'transparent'}">

      <span style="flex:1;font-size:14px;color:#E8DCC6">${m.name}</span>

    </li>`).join('');
  list.querySelectorAll('[data-lang]').forEach(li => li.addEventListener('click', () => {
    lang = li.getAttribute('data-lang'); langOpen = false; render();
  }));
  document.getElementById('current-lang-code').textContent = meta.code;

  document.getElementById('pillars-grid').innerHTML = PILLARS.map(p => `

      <div style="position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(15,11,8,.78))"></div>

      </div>
    </div>`).join('');

  // Carousel
  document.getElementById('carousel-stage').innerHTML = OBJECTS.map(o => `
    <div class="carousel-card" style="position:absolute;left:50%;top:50%;width:196px;height:276px;margin-left:-98px;margin-top:-138px;transform-style:preserve-3d;backface-visibility:hidden;border-radius:16px;overflow:hidden;border:1px solid rgba(240,195,107,.35);background:linear-gradient(170deg,#241a0f,#130c06);box-shadow:0 26px 60px rgba(0,0,0,.6),inset 0 0 0 1px rgba(240,195,107,.08);display:flex;flex-direction:column;">

        <span style="font-family:'Barlow',monospace;font-size:9px;letter-spacing:.03em;color:#E3CB9C;background:rgba(15,11,8,.62);border:1px dashed rgba(176,138,94,.5);border-radius:6px;padding:4px 7px;text-align:center;line-height:1.3;">${o.ph}</span>
      </div>
      <div style="padding:6px 12px 15px;text-align:center;">
        <div style="font-family:'Cinzel',serif;font-weight:600;font-size:14.5px;color:#F3E4C4;line-height:1.12;">${o.name}</div>
        <div style="font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:#C98A5E;margin-top:5px;">${o.cat}</div>
      </div>
    </div>`).join('');
  setupCarouselGeometry();

  // Footer socials & languages
  document.getElementById('footer-socials').innerHTML = SOCIALS.map(s => `
    <a href="#" class="social-icon" aria-label="${s.name}" style="width:38px;height:38px;border-radius:9px;display:grid;place-items:center;border:1px solid rgba(240,195,107,.22);color:#C98A5E;font-size:12px;font-weight:600;letter-spacing:.02em;">${s.abbr}</a>`).join('');
  document.getElementById('footer-langs').innerHTML = LANG_META.map(m => `
    <button data-lang="${m.key}" class="footer-lang-btn" style="font-family:'Cinzel',serif;font-size:11px;font-weight:700;letter-spacing:.05em;color:#B7A585;background:none;border:1px solid rgba(240,195,107,.2);border-radius:7px;padding:6px 10px;cursor:pointer;">${m.code}</button>`).join('');
  document.getElementById('footer-langs').querySelectorAll('[data-lang]').forEach(btn => btn.addEventListener('click', () => {
    lang = btn.getAttribute('data-lang'); render();
  }));
  document.getElementById('footer-legal').textContent = t.footerLegal;

  // Mobile menu language buttons
  document.getElementById('mobile-langs').innerHTML = LANG_META.map(m => `
    <button data-lang="${m.key}" style="display:flex;align-items:center;gap:8px;font-family:'Cinzel',serif;font-size:12px;font-weight:700;letter-spacing:.05em;color:#E8DCC6;background:${m.key === lang ? 'rgba(240,195,107,.12)' : 'transparent'};border:1px solid rgba(240,195,107,.22);border-radius:9px;padding:9px 13px;cursor:pointer;">${m.code} <span style="font-family:'Barlow',sans-serif;font-weight:400;font-size:12px;color:#B7A585;">${m.name}</span></button>`).join('');
  document.getElementById('mobile-langs').querySelectorAll('[data-lang]').forEach(btn => btn.addEventListener('click', () => {
    lang = btn.getAttribute('data-lang'); closeMobileMenu(); render();
  }));

  setupReveals();
}

function openMobileMenu(){ menuOpen = true; document.getElementById('mobile-menu-panel').style.display = 'flex'; }
function closeMobileMenu(){ menuOpen = false; document.getElementById('mobile-menu-panel').style.display = 'none'; }
document.getElementById('burger').addEventListener('click', openMobileMenu);
document.getElementById('mobile-menu-close').addEventListener('click', closeMobileMenu);
document.querySelectorAll('.mobile-link').forEach(a => a.addEventListener('click', closeMobileMenu));

/* ---- Reveal on scroll ---- */
const revealObserver = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      entry.target.classList.add('is-visible');
      revealObserver.unobserve(entry.target);
    }
  });
}, { threshold: 0.12, rootMargin: '0px 0px -8% 0px' });

function setupReveals(){
  document.querySelectorAll('[data-reveal]').forEach(el => {
    if (el.dataset.revealBound) return;
    el.dataset.revealBound = '1';
    if (REDUCED) { el.classList.add('is-visible'); return; }
    if (!el.hasAttribute('data-parallax')) el.style.transform = 'translateY(30px)';
    el.style.opacity = '0';
    revealObserver.observe(el);
  });
}

/* ---- Language dropdown toggle ---- */
document.getElementById('lang-toggle').addEventListener('click', () => {
  langOpen = !langOpen;
  document.getElementById('lang-list').style.display = langOpen ? 'block' : 'none';
  document.getElementById('lang-caret').style.transform = langOpen ? 'rotate(180deg)' : 'rotate(0deg)';
});

/* ---- Join form ---- */
document.getElementById('join-form').addEventListener('submit', (e) => {
  e.preventDefault();
  document.getElementById('join-form').style.display = 'none';
  const box = document.getElementById('thanks-box');
  box.style.display = 'block';
  box.classList.add('is-visible');
  box.style.opacity = '1';
});

/* ---- Header scroll background + parallax ---- */
let pLayers = [];
function measureParallax(){
  pLayers = Array.from(document.querySelectorAll('[data-parallax]')).map(el => {
    const s = parseFloat(el.getAttribute('data-parallax')) || 0;
    const base = el.getAttribute('data-parallax-base') || '';
    el.style.transform = base;
    const r = el.getBoundingClientRect();
    return { el, s, base, mid: r.top + (window.scrollY || window.pageYOffset) + r.height / 2 };
  });
}

let ticking = false;
function onScroll(){
  if (ticking) return; ticking = true;
  requestAnimationFrame(() => {
    const y = window.scrollY || window.pageYOffset;
    if (!REDUCED) {
      const vc = y + window.innerHeight / 2;
      const mf = window.innerWidth < 768 ? 0.5 : 1;
      pLayers.forEach(l => {
        const off = (vc - l.mid) * l.s * mf;
        const t = `translate3d(0,${off.toFixed(1)}px,0)`;
        l.el.style.transform = l.base ? `${l.base} ${t}` : t;
      });
    }
    const header = document.getElementById('header');
    if (y > 40) {
      header.style.background = 'rgba(12,9,6,.82)';
      header.style.backdropFilter = 'blur(14px)';
      header.style.webkitBackdropFilter = 'blur(14px)';
      header.style.borderBottomColor = 'rgba(240,195,107,.14)';
    } else {
      header.style.background = 'transparent';
      header.style.backdropFilter = 'none';
      header.style.webkitBackdropFilter = 'none';
      header.style.borderBottomColor = 'transparent';
    }
    ticking = false;
  });
}
window.addEventListener('scroll', onScroll, { passive: true });
window.addEventListener('resize', () => { measureParallax(); render(); }, { passive: true });

/* ---- 3D carousel ---- */
let carAngle = 0, carVel = 0, carDragging = false, carDragBound = false;
function setupCarouselGeometry(){
  const stage = document.getElementById('carousel-stage');
  const kids = stage.children, n = kids.length;
  if (!n) return;
  const step = 360 / n;
  const radius = Math.max(220, Math.round(98 / Math.tan(Math.PI / n)) + 72);
  for (let i = 0; i < n; i++) {
    kids[i].style.transformStyle = 'flat';
    kids[i].style.backfaceVisibility = 'hidden';
    kids[i].style.transform = `rotateY(${i * step}deg) translateZ(${radius}px)`;
  }
  stage.dataset.radius = radius;
}
function bindCarouselDrag(){
  const wrap = document.getElementById('carousel-wrap');
  if (!wrap || carDragBound) return;
  carDragBound = true;
  let lastX = 0;
  wrap.addEventListener('pointerdown', (e) => { carDragging = true; lastX = e.clientX; carVel = 0; wrap.style.cursor = 'grabbing'; });
  window.addEventListener('pointermove', (e) => { if (!carDragging) return; const d = e.clientX - lastX; lastX = e.clientX; carAngle += d * 0.4; carVel = d * 0.4; }, { passive: true });
  window.addEventListener('pointerup', () => { if (carDragging) { carDragging = false; wrap.style.cursor = 'grab'; } }, { passive: true });
}
function carouselLoop(){
  bindCarouselDrag();
  const stage = document.getElementById('carousel-stage');
  const radius = parseFloat(stage.dataset.radius) || 300;
  const auto = REDUCED ? 0 : 0.09;
  if (!carDragging) { carAngle += carVel + auto; carVel *= 0.9; if (Math.abs(carVel) < 0.02) carVel = 0; }
  stage.style.transform = `translateZ(${-radius}px) rotateY(${carAngle}deg)`;
  requestAnimationFrame(carouselLoop);
}

/* ---- Golden dust canvas ---- */
function initCanvas(){
  const cv = document.getElementById('hero-canvas');
  const ctx = cv.getContext('2d');
  let w, h, dpr, parts;
  const setup = () => {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = cv.clientWidth; h = cv.clientHeight;
    cv.width = w * dpr; cv.height = h * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const density = w < 640 ? 34 : 70;
    const n = REDUCED ? Math.round(density * 0.35) : density;
    parts = Array.from({ length: n }, () => ({
      x: Math.random() * w, y: Math.random() * h,
      r: Math.random() * 1.9 + 0.5,
      vx: (Math.random() - 0.5) * 0.12, vy: -(Math.random() * 0.28 + 0.05),
      a: Math.random() * 0.5 + 0.2, tw: Math.random() * Math.PI * 2
    }));
  };
  setup();
  window.addEventListener('resize', setup, { passive: true });
  if (REDUCED) {
    ctx.clearRect(0, 0, w, h);
    parts.forEach(p => { ctx.beginPath(); ctx.fillStyle = `rgba(240,200,120,${p.a})`; ctx.arc(p.x, p.y, p.r, 0, 7); ctx.fill(); });
    return;
  }
  const tick = () => {
    ctx.clearRect(0, 0, w, h);
    for (const p of parts) {
      p.x += p.vx; p.y += p.vy; p.tw += 0.03;
      if (p.y < -6) { p.y = h + 6; p.x = Math.random() * w; }
      if (p.x < -6) p.x = w + 6; if (p.x > w + 6) p.x = -6;
      const tw = (Math.sin(p.tw) * 0.35 + 0.65);
      ctx.beginPath();
      ctx.fillStyle = `rgba(245,205,125,${(p.a * tw).toFixed(3)})`;
      ctx.arc(p.x, p.y, p.r, 0, 7); ctx.fill();
    }
    requestAnimationFrame(tick);
  };
  tick();
}

render();
measureParallax();
onScroll();
initCanvas();
carouselLoop();
</script>
